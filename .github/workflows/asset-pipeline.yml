name: TAKY Approved Asset Registry Contract
on:
  pull_request:
    paths:
      - 'tools/approved_asset_registry.py'
      - 'tools/approved_asset_registry_test.py'
      - '.github/workflows/asset-pipeline.yml'
  push:
    branches: [main]
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest tools/approved_asset_registry_test.py
      - run: python -m unittest tools/approved_asset_export_test.py
      - run: python -m unittest tools/specialist_handoff_accept_test.py
